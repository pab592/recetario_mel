<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recetario de Mel 💕</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #ffe4ec;
}

header {
    text-align: center;
    padding: 30px;
    background: #ffb6c1;
    color: white;
    font-size: 28px;
    font-weight: bold;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

button {
    background: #ff85a2;
    border: none;
    padding: 8px 12px;
    color: white;
    border-radius: 15px;
    cursor: pointer;
    margin: 5px 5px 5px 0;
}

.formulario {
    display: none;
    background: #fff0f5;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

input, textarea {
    width: 100%;
    margin-bottom: 10px;
    padding: 8px;
    border-radius: 10px;
    border: 1px solid #ccc;
}

.receta {
    background: #fff0f5;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.receta img {
    width: 100%;
    border-radius: 10px;
    margin-top: 10px;
}

h2 {
    color: #ff4d88;
}

#mensajeGuardado {
    color: #ff4d88;
    display: none;
    margin-bottom: 10px;
}

.footer {
    text-align: center;
    padding: 20px;
    color: #888;
}
</style>
</head>

<body>

<header>Recetario de Mel 💕</header>

<div class="container">

<button onclick="nuevaReceta()">Agregar receta ✍️</button>

<div class="formulario" id="formulario">
    <input type="text" id="titulo" placeholder="Nombre de la receta">
    <textarea id="ingredientes" placeholder="Ingredientes (separados por coma)"></textarea>
    <textarea id="pasos" placeholder="Pasos"></textarea>
    <input type="file" id="imagen">
    <button onclick="guardarReceta()">Guardar 💕</button>
</div>

<p id="mensajeGuardado">Guardado con éxito 💕</p>

<h2>📖 Recetas guardadas</h2>
<div id="recetas"></div>

</div>

<div class="footer">Hecho con amor para Mel 💕</div>

<script>
let editIndex = null;

function nuevaReceta() {
    editIndex = null;
    document.getElementById("formulario").style.display = "block";

    document.getElementById("titulo").value = "";
    document.getElementById("ingredientes").value = "";
    document.getElementById("pasos").value = "";
    document.getElementById("imagen").value = "";
}

function guardarReceta() {
    const titulo = document.getElementById("titulo").value;
    const ingredientes = document.getElementById("ingredientes").value;
    const pasos = document.getElementById("pasos").value;
    const imagenInput = document.getElementById("imagen");

    if (!titulo || !ingredientes || !pasos) {
        alert("Completa todos los campos 💕");
        return;
    }

    let recetas = JSON.parse(localStorage.getItem("recetas")) || [];

    function guardarFinal(imagenBase64) {
        const receta = { titulo, ingredientes, pasos, imagen: imagenBase64 };

        if (editIndex !== null) {
            recetas[editIndex] = receta;
        } else {
            recetas.push(receta);
        }

        localStorage.setItem("recetas", JSON.stringify(recetas));
        mostrarRecetas();

        document.getElementById("mensajeGuardado").style.display = "block";
        setTimeout(() => {
            document.getElementById("mensajeGuardado").style.display = "none";
        }, 2000);

        document.getElementById("formulario").style.display = "none";
    }

    if (imagenInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function () {
            guardarFinal(reader.result);
        };
        reader.readAsDataURL(imagenInput.files[0]);
    } else {
        const imagenActual = editIndex !== null ? recetas[editIndex].imagen : "";
        guardarFinal(imagenActual);
    }
}

function mostrarRecetas() {
    const contenedor = document.getElementById("recetas");
    contenedor.innerHTML = "";

    let recetas = JSON.parse(localStorage.getItem("recetas")) || [];

    recetas.forEach((receta, index) => {
        const div = document.createElement("div");
        div.classList.add("receta");

        div.innerHTML = `
            <h2>${receta.titulo}</h2>
            <p><strong>Ingredientes:</strong> ${receta.ingredientes}</p>
            <p><strong>Pasos:</strong> ${receta.pasos}</p>
            <img src="${receta.imagen}">
            <br>
            <button onclick="editarReceta(${index})">Editar ✏️</button>
            <button onclick="eliminarReceta(${index})">Eliminar 🗑️</button>
        `;

        contenedor.appendChild(div);
    });
}

function eliminarReceta(index) {
    let recetas = JSON.parse(localStorage.getItem("recetas")) || [];
    recetas.splice(index, 1);
    localStorage.setItem("recetas", JSON.stringify(recetas));
    mostrarRecetas();
}

function editarReceta(index) {
    let recetas = JSON.parse(localStorage.getItem("recetas")) || [];
    const receta = recetas[index];

    document.getElementById("titulo").value = receta.titulo;
    document.getElementById("ingredientes").value = receta.ingredientes;
    document.getElementById("pasos").value = receta.pasos;

    document.getElementById("formulario").style.display = "block";
    editIndex = index;
}

mostrarRecetas();
</script>

</body>
</html>
